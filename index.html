<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <!-- Light Marked parser for client-side Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--page-background);
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: pan-y; /* Allows vertical scrolling for the page */
    }
    
    .surface-panel {
      width: var(--size-player-width);
      margin: var(--size-player-margin);
      padding: var(--size-player-padding);
      border: 1px solid var(--ui-player-border);
      border-radius: var(--size-player-radius);
      background: var(--ui-player-background);
      color: var(--ui-player-text);
      font-family: var(--font-ui);
    }
    #page-intro {
      width: var(--size-player-width);
      margin: var(--size-page-intro-margin);
      color: var(--ui-player-text);
      font-family: var(--font-ui);
    }
    #page-title {
      font-family: var(--font-display);
      font-size: var(--size-page-title-font-size);
      font-weight: 700;
      line-height: 1.15;
    }
    #page-description {
      margin-top: var(--size-page-description-gap);
      color: var(--ui-player-secondary-text);
      font-size: var(--size-page-description-font-size);
      line-height: 1.45;
    }

    /* Container strictly wrapping the SVG Wheel at the top */
    #wheel-container {
      width: 100%;
      max-width: 100%;
      display: flex;
      align-items: flex-start; /* Positions wheel at top, not centered */
      justify-content: center;
      flex-shrink: 0;
    }
    
    svg {
      width: 100%;
      max-width: 600px; /* Limits max diameter on larger screens */
      height: auto;
      aspect-ratio: 1;
      max-height: 600px;
      display: block;
    }
    .ring {
      cursor: grab;
      touch-action: none; /* Only block native scroll when user drags a wheel ring directly */
    }
    .ring:active {
      cursor: grabbing;
    }
    .segment {
      stroke-width: 2;
    }
    .arrow {
      fill: var(--ui-arrow-fill);
      stroke: var(--ui-arrow-stroke);
      stroke-width: 3;
      stroke-linejoin: round;
      pointer-events: none;
      filter: drop-shadow(var(--ui-arrow-shadow));
    }
    .playback-dot-active {
      stroke: var(--ui-playback-dot-stroke);
      stroke-width: var(--size-playback-dot-stroke-width);
    }
    .playback-dot-active[data-dot-value="1"] {
      fill: var(--ui-playback-dot-fill);
    }
    .playback-dot-inactive {
      opacity: var(--effect-playback-dot-inactive-opacity);
    }

    #key-controls {
      width: 100%;
      padding: 0;
      color: var(--ui-player-text);
      font-family: var(--font-ui);
    }
    .key-control + .key-control {
      margin-top: var(--size-control-gap);
    }
    .key-control h2 {
      margin-bottom: var(--size-label-gap);
      font-size: var(--size-label-font-size);
      font-weight: 600;
    }
    .key-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--size-option-min-width), 1fr));
      gap: var(--size-option-gap);
      padding: var(--size-options-padding);
    }
    .key-option {
      width: 100%;
      min-width: 0;
      min-height: var(--size-option-height);
      padding: var(--size-option-padding);
      border: 1px solid var(--ui-control-border);
      border-radius: var(--size-control-radius);
      background: var(--ui-control-background);
      color: var(--ui-controls-text);
      font: inherit;
      font-size: var(--size-button-font-size);
      line-height: 1.1;
      overflow-wrap: anywhere;
      cursor: pointer;
    }
    .key-option[data-native-key][aria-pressed="true"] {
      border-color: var(--ui-native-key-selected-border);
      background: var(--ui-native-key-selected-background);
      color: var(--ui-control-selected-text);
      font-weight: 700;
    }
    .key-option[data-target-key][aria-pressed="true"] {
      border-color: var(--ui-target-key-selected-border);
      background: var(--ui-target-key-selected-background);
      color: var(--ui-control-selected-text);
      font-weight: 700;
    }
    .key-option small {
      display: block;
      margin-top: var(--size-secondary-label-gap);
      font-size: var(--size-secondary-label-font-size);
      line-height: var(--size-secondary-label-line-height);
    }

    #scale-player {
      display: block;
    }
    #scale-player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--size-player-header-gap);
    }
    #scale-player-header > div:first-child {
      flex: 1 1 auto;
      min-width: 0;
    }
    #scale-player-status {
      font-family: var(--font-display);
      font-size: var(--size-status-font-size);
    }
    #scale-player-detail {
      margin-top: var(--size-detail-gap);
      color: var(--ui-player-secondary-text);
      font-size: var(--size-detail-font-size);
    }
    #play-scale-button {
      display: grid;
      place-items: center;
      width: var(--size-play-button-width);
      min-width: var(--size-play-button-width);
      height: var(--size-play-button-width);
      padding: var(--size-play-button-padding);
      border: 0;
      border-radius: 50%;
      background: var(--ui-play-button-background);
      color: var(--ui-play-button-text);
      font: inherit;
      font-size: var(--size-button-font-size);
      font-weight: 700;
      cursor: pointer;
      flex: 0 0 auto;
    }
    #play-scale-button[aria-pressed="true"] {
      background: var(--ui-play-button-active-background);
      color: var(--ui-play-button-active-text);
    }
    .play-scale-icon {
      width: var(--size-play-button-icon-size);
      height: var(--size-play-button-icon-size);
    }
    #play-scale-button:disabled {
      cursor: default;
      opacity: 0.7;
    }
    #playback-speed-row {
      display: flex;
      flex-direction: column;
      gap: var(--size-speed-control-gap);
      margin-top: var(--size-player-row-gap);
    }
    #playback-speed-label {
      color: var(--ui-player-secondary-text);
      font-size: var(--size-detail-font-size);
    }
    #playback-speed-options {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: var(--size-speed-option-gap);
    }
    .speed-option {
      min-width: 0;
      padding: var(--size-speed-option-padding);
      border: 1px solid var(--ui-control-border);
      border-radius: var(--size-control-radius);
      background: var(--ui-control-background);
      color: var(--ui-controls-text);
      font: inherit;
      font-size: var(--size-speed-option-font-size);
      cursor: pointer;
    }
    .speed-option[aria-pressed="true"] {
      border-color: var(--ui-control-selected-border);
      background: var(--ui-control-selected-background);
      color: var(--ui-control-selected-text);
      font-weight: 700;
    }
    #scale-sequence-section {
      margin-top: var(--size-player-row-gap);
    }
    #scale-sequence-heading {
      margin-bottom: var(--size-sequence-heading-gap);
      color: var(--ui-player-secondary-text);
      font-size: var(--size-detail-font-size);
      font-weight: 600;
    }
    #scale-sequence-grid {
      display: flex;
      flex-direction: column;
      gap: var(--size-sequence-octave-gap);
    }
    .scale-sequence-octave {
      min-width: 0;
    }
    .scale-sequence-octave-heading {
      margin-bottom: var(--size-sequence-octave-heading-gap);
      color: var(--ui-sequence-degree);
      font-size: var(--size-sequence-degree-font-size);
      font-weight: 600;
    }
    .scale-sequence-octave-steps {
      display: grid;
      grid-template-columns: repeat(var(--sequence-degree-count), minmax(var(--size-sequence-step-min-width), 1fr));
      gap: var(--size-sequence-step-gap);
      overflow-x: auto;
    }
    .scale-sequence-step {
      min-width: 0;
      padding: var(--size-sequence-step-padding);
      border: 1px solid var(--ui-sequence-step-border);
      border-radius: var(--size-sequence-step-radius);
      background: var(--ui-sequence-step-background);
      text-align: center;
    }
    .scale-sequence-step.active {
      border-color: var(--ui-sequence-step-active-border);
      background: var(--ui-sequence-step-active-background);
    }
    .scale-sequence-note {
      overflow: hidden;
      color: var(--ui-sequence-note);
      font-size: var(--size-sequence-note-font-size);
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .scale-sequence-degree {
      margin-top: var(--size-sequence-degree-gap);
      color: var(--ui-sequence-degree);
      font-size: var(--size-sequence-degree-font-size);
    }
    .scale-sequence-holes {
      display: flex;
      justify-content: center;
      gap: var(--size-sequence-hole-gap);
      margin-top: var(--size-sequence-holes-gap);
    }
    .scale-sequence-hole {
      flex: 0 0 var(--size-sequence-hole-diameter);
      width: var(--size-sequence-hole-diameter);
      height: var(--size-sequence-hole-diameter);
      border: var(--size-hole-border-width) solid var(--ui-sequence-hole-border);
      border-radius: 50%;
    }
    .scale-sequence-hole.closed {
      border-color: var(--ui-sequence-hole-fill);
      background: var(--ui-sequence-hole-fill);
    }
    .scale-sequence-hole.half {
      border-color: var(--ui-sequence-hole-fill);
      background: linear-gradient(90deg, var(--ui-sequence-hole-fill) 50%, transparent 50%);
    }
    #playback-fingers {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--size-playback-fingering-gap);
      margin-top: var(--size-player-row-gap);
    }
    #playback-fingers.placeholder {
      visibility: hidden;
    }
    .playback-fingering-caption {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: var(--size-progress-gap);
    }
    .playback-fingering-note {
      color: var(--ui-player-text);
      font-size: var(--size-playback-fingering-note-font-size);
      font-weight: 700;
    }
    .playback-fingering-degree {
      color: var(--ui-player-secondary-text);
      font-size: var(--size-playback-fingering-degree-font-size);
    }
    .playback-fingering-holes {
      display: flex;
      justify-content: center;
      gap: var(--size-hole-gap);
    }
    .playback-hole {
      width: var(--size-hole-diameter);
      height: var(--size-hole-diameter);
      border: var(--size-hole-border-width) solid var(--ui-hole-border);
      border-radius: 50%;
    }
    .playback-hole.closed {
      background: var(--ui-hole-fill);
      border-color: var(--ui-hole-fill);
    }
    .playback-hole.half {
      background: linear-gradient(90deg, var(--ui-hole-fill) 50%, transparent 50%);
      border-color: var(--ui-hole-fill);
    }
    #scale-progress {
      display: flex;
      justify-content: flex-start;
      gap: var(--size-progress-gap);
      margin-top: var(--size-detail-gap);
    }
    .scale-progress-dot {
      flex: 0 0 var(--size-progress-dot);
      width: var(--size-progress-dot);
      height: var(--size-progress-dot);
      border-radius: 50%;
      background: var(--ui-progress-inactive);
    }
    .scale-progress-dot.active {
      background: var(--ui-progress-active);
    }
    
    /* HTML Label Container Styling */
    .html-label-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
      line-height: 1;
    }
    .html-label-content {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: bold;
      white-space: nowrap;
      user-select: none;
    }

    /* Markdown Footer Styling */
    #markdown-footer {
      width: 100%;
      max-width: 800px;
      padding: 2rem 1.5rem 4rem 1.5rem;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      user-select: text; /* Allows text highlighting in footer */
    }
    #markdown-footer h1, #markdown-footer h2, #markdown-footer h3 {
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid var(--ui-footer-rule);
      padding-bottom: 0.3rem;
    }
    #markdown-footer p {
      margin-bottom: 1rem;
    }
    #markdown-footer ul, #markdown-footer ol {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }
    #markdown-footer code {
      background: var(--ui-footer-code-background);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
    }
    #markdown-footer a {
      color: var(--ui-footer-link);
    }
  </style>
</head>
<body>

  <header id="page-intro">
    <h1 id="page-title"></h1>
    <p id="page-description"></p>
  </header>

  <section class="surface-panel">
    <div id="key-controls">
      <div class="key-control">
        <h2 id="native-key-heading"></h2>
        <div id="native-key-options" class="key-options" role="group"></div>
      </div>
      <div class="key-control">
        <h2 id="target-key-heading"></h2>
        <div id="target-key-options" class="key-options" role="group"></div>
      </div>
    </div>
  </section>

  <section id="wheel-panel" class="surface-panel">
    <div id="wheel-container">
      <svg id="wheelSvg"></svg>
    </div>
  </section>

  <section id="scale-player" class="surface-panel">
    <div id="scale-player-header">
      <div>
        <div id="scale-player-status" aria-live="polite"></div>
        <div id="scale-player-detail"></div>
        <div id="scale-progress"></div>
      </div>
      <button id="play-scale-button" type="button" aria-pressed="false"></button>
    </div>
      <div id="playback-speed-row">
        <span id="playback-speed-label"></span>
        <div id="playback-speed-options" role="group"></div>
      </div>
      <div id="scale-sequence-section">
        <div id="scale-sequence-heading"></div>
        <div id="scale-sequence-grid" role="group"></div>
      </div>
    <div id="playback-fingers"></div>
  </section>

  <div id="markdown-footer"></div>

  <script>
    const CONFIG = {
      // Toggle to force ring labels to always remain visually upright
      uprightLabels: false,

      // Tweak the interface palette, text, sizing, motion, music, and playback here.
      interface: {
        colors: {
          arrowFill: '#ffffff',
          arrowStroke: '#000000',
          arrowShadow: '0px 0px 3px rgba(0, 0, 0, 0.8)',
          controlsText: '#f2f1e8',
          controlBorder: '#686868',
          controlBackground: '#252525',
          controlSelectedBorder: '#B5A993',
          controlSelectedBackground: '#D8D0BE',
          controlSelectedText: '#303A35',

          nativeKeySelectedBackground: '#AFC6B6',
          targetKeySelectedBorder: '#66899B',
          targetKeySelectedBackground: '#9FB8C9',

          playbackDotFill: '#24475F',
          footerRule: 'rgba(255, 255, 255, 0.15)',

          footerLink: '#4da6ff'
        },
        sizes: {

          controlsPadding: '12px 16px 4px',
          pageIntroMargin: '24px 0 4px',

          pageDescriptionFontSize: '14px',

        fonts: {

        },
        effects: {
          playbackDotInactiveOpacity: 0.18
        },
        labels: {
          pageTitle: '笛子 (Dizi) 指法轮盘',
          pageDescription: 'Explore flute keys, fingerings, and a two-octave scale.',
          keyControlsAria: 'Dial key settings',
          nativeKey: "Your flute's native key",

          scaleSequenceOctaveLabels: ['Lower octave', 'Higher octave'],
          scaleSequenceOctaveTemplate: 'Octave {octave}',
          scaleStepAria: 'Degree {degree}{octaveSuffix}, {note}',
          scaleDegreeTemplate: '{degree}{octaveSuffix}',
          sequenceUpperOctaveSuffix: ' · octave',
          currentFingeringAria: 'Current fingering',

          unsupportedAudio: 'Web Audio is not supported in this browser.'

      },
      motion: {
        selectionDurationMs: 500,
        selectionEasing: 'easeInOutCubic',
        snapProgressIncrement: 0.12,
        inertiaFriction: 0.94,
        inertiaStopVelocity: 0.1,
        dragInertiaThreshold: 0.4,
        velocityFrameDurationMs: 16.6,
        minimumPointerDeltaMs: 16

      music: {
        noteNames: ['C', 'C#/D♭', 'D', 'E♭/D#', 'E', 'F', 'F#/G♭', 'G', 'A♭/G#', 'A', 'B♭/A#', 'B'],
        majorOffsets: [0, 2, 4, 5, 7, 9, 11],

        speedOptions: [0.1, 0.2, 0.5, 1, 1.5, 1.7, 2],
        defaultSpeed: 1,
        noteDurationMs: 420,
        interNoteGapMs: 0,
        oscillatorTailMs: 20,
        oscillatorType: 'sine',

        referenceFrequencyHz: 440,
        referenceMidiNote: 69,
        attackDurationMs: 30,

        sustainGain: 0.22,

      colors: {
        // background: '#202724', // Main canvas background
        background: '#111111', // Main canvas background
        
        // Default single ring colors (used as fallbacks if segment array isn't provided)
        outer: '#AFC6B6',
        middle: '#D8D0BE',
        inner: '#9FB8C9',

        // Configure individual colors for each segment (12 segments per ring).
        // Set to null or remove a ring's array to use its uniform fallback color above.

          '#AFC6B6', '#AFC6B6', '#AFC6B6', '#AFC6B6',
          '#AFC6B6', '#AFC6B6', '#AFC6B6', '#AFC6B6',
          '#AFC6B6', '#AFC6B6', '#AFC6B6', '#AFC6B6'
        ],
        middleSegments: [
          '#D8D0BE', '#D8D0BE', '#D8D0BE', '#D8D0BE',
          '#D8D0BE', '#D8D0BE', '#D8D0BE', '#D8D0BE',
          '#D8D0BE', '#D8D0BE', '#D8D0BE', '#D8D0BE'

        innerSegments: [
          '#9FB8C9', '#9FB8C9', '#9FB8C9', '#9FB8C9',
          '#9FB8C9', '#9FB8C9', '#9FB8C9', '#9FB8C9',
          '#9FB8C9', '#9FB8C9', '#9FB8C9', '#9FB8C9'
        ]
      },

      // Configurable label text colors
      labelColors: {

# English Instructions

## Tool Description
This tool consists of three rotatable concentric rings: inner, middle, and outer.
1) The inner ring represents scale degrees (do, re, mi, fa, so, la, ti), abbreviated as 1, 2, 3, 4, 5, 6, 7.
2) The middle ring represents pitch names (C, D, E, F, G, A, B), serving as the key of the flute.
3) The outer ring represents the flute fingering chart. Moving from the outside inward, the first fingerhole is shown: white indicates an open hole, black indicates a closed hole, and half-black indicates a half-holed note.
4) Generally, the third hole of a flute is marked with a pitch name, which indicates the pitch produced when opening the first, second, and third holes.
5) If your flute is marked with "D", you must align the "D" on the middle ring with the fingering for the first three holes on the outer ring. If you align "1" on the inner ring with "D" on the middle ring, you play in the key of D; if you align "5" on the inner ring with "D" on the middle ring, you play in the key of G.

## Rules of Use
1) Scale pitch names cannot be repeated; enharmonic equivalents (such as E-sharp and F) may be used.
2) Once you determine which scale degree the third hole represents, aligning the "1" on the small (inner) ring and the major arrow with the pitch name on the middle ring will give you that key.
3) In the outer ring's flute fingering, moving clockwise to the right shifts toward higher pitches, while moving counter-clockwise shifts toward lower pitches. Each step represents a semitone; adjacent positions indicate a semitone interval.
4) Within each step of the outer ring's flute fingering, positions leaning toward the lower direction indicate normal blowing (pingchui), while positions leaning toward the higher pitch indicate overblowing (chaochui).

This music wheel is provided for Chinese flute students and teachers to quickly understand how different keys and fingerings correspond to the resulting played keys on various flutes of different keys.

    function updateDimensions() {
      updateBackground();

      const rawOuter = Math.max(CONFIG.thicknessWeights.outer || 0, 0);
      const rawMiddle = Math.max(CONFIG.thicknessWeights.middle || 0, 0);
      const rawInner = Math.max(CONFIG.thicknessWeights.inner || 0, 0);

      const totalWeight = rawOuter + rawMiddle + rawInner || 1;

      const outerThickness = maxRadius * (rawOuter / totalWeight);
      const middleThickness = maxRadius * (rawMiddle / totalWeight);
      const innerThickness = maxRadius * (rawInner / totalWeight);

      const rOuterMax = maxRadius;
      const rOuterMin = rOuterMax - outerThickness;

      const rMiddleMax = rOuterMin;
      const rMiddleMin = rMiddleMax - middleThickness;

      const rInnerMax = rMiddleMin;
      const rInnerMin = Math.max(rInnerMax - innerThickness, 0);

      ringsConfig = [
        { id: 'outerRing',  rOuter: rOuterMax,  rInner: rOuterMin,  color: CONFIG.colors.outer,  segmentColors: CONFIG.colors.outerSegments,  arrowType: 'inward',  type: 'dots' },
        { id: 'middleRing', rOuter: rMiddleMax, rInner: rMiddleMin, color: CONFIG.colors.middle, segmentColors: CONFIG.colors.middleSegments, arrowType: null,    type: 'middleLabels' },
        { id: 'innerRing',  rOuter: rInnerMax,  rInner: rInnerMin,  color: CONFIG.colors.inner,  segmentColors: CONFIG.colors.innerSegments,  arrowType: 'outward', type: 'innerLabels' }
      ];

      renderRings();
    }

    function createSegmentPath(rInner, rOuter, startAngleDeg, endAngleDeg) {
      const toRad = deg => (deg - 90) * (Math.PI / 180);
      const startRad = toRad(startAngleDeg);
      const endRad = toRad(endAngleDeg);

      const x1 = center.x + rOuter * Math.cos(startRad);
      const y1 = center.y + rOuter * Math.sin(startRad);
      const x2 = center.x + rOuter * Math.cos(endRad);
      const y2 = center.y + rOuter * Math.sin(endRad);

      const x3 = center.x + rInner * Math.cos(endRad);
      const y3 = center.y + rInner * Math.sin(endRad);
      const x4 = center.x + rInner * Math.cos(startRad);
      const y4 = center.y + rInner * Math.sin(startRad);

      return `M ${x1} ${y1} A ${rOuter} ${rOuter} 0 0 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 0 0 ${x4} ${y4} Z`;
    }

    function renderSegmentDots(rInner, rOuter, startAngleDeg, endAngleDeg, segIndex) {
      const g = document.createElementNS(SVG_NS, 'g');

      const ringWidth = rOuter - rInner;
      const dotRadius = CONFIG.outerDotRadius ? CONFIG.outerDotRadius : Math.max(ringWidth * 0.032, 2.5);
      
      const leftAngle = startAngleDeg + 3.5;
      const rightAngle = endAngleDeg - 3.5;

      const startR = rInner + ringWidth * 0.18;
      const endR = rOuter - ringWidth * 0.18;
      const rStep = (endR - startR) / (NUM_ROWS - 1);

      const leftRowIndex = segIndex * 2;
      const rightRowIndex = segIndex * 2 + 1;

      const formatRowData = (raw) => {
        const arr = Array.isArray(raw) ? raw.slice(0, NUM_ROWS) : [];
        while (arr.length < NUM_ROWS) arr.push(0);
        return arr;
      };

      const leftRowData = formatRowData(CONFIG.outerDotColumns[leftRowIndex]);
      const rightRowData = formatRowData(CONFIG.outerDotColumns[rightRowIndex]);

      const renderRowAtAngle = (rowData, angleDeg, rowIndex) => {
        const rad = (angleDeg - 90) * (Math.PI / 180);
        for (let idx = 0; idx < NUM_ROWS; idx++) {
          const val = rowData[idx];
          const r = startR + idx * rStep;
          const cx = center.x + r * Math.cos(rad);
          const cy = center.y + r * Math.sin(rad);

          const circle = document.createElementNS(SVG_NS, 'circle');
          circle.setAttribute('cx', cx);
          circle.setAttribute('cy', cy);
          circle.setAttribute('r', dotRadius);
          circle.setAttribute('data-dot-row-index', rowIndex);
          circle.setAttribute('data-dot-value', val);

          if (val === 1) {
            circle.setAttribute('fill', CONFIG.circleColors.fill);
            circle.setAttribute('stroke', CONFIG.circleColors.fill);
          } else if (val === 0.5) {
            const gradId = `halfGrad_${Math.round(angleDeg * 100)}`;
            let defs = svg.querySelector('defs');
            if (!defs) {
              defs = document.createElementNS(SVG_NS, 'defs');
              svg.appendChild(defs);
            }
            if (!document.getElementById(gradId)) {
              const grad = document.createElementNS(SVG_NS, 'linearGradient');
              grad.setAttribute('id', gradId);
              grad.setAttribute('x1', '100%');
              grad.setAttribute('y1', '0%');
              grad.setAttribute('x2', '0%');
              grad.setAttribute('y2', '0%');
              grad.setAttribute('gradientTransform', `rotate(${angleDeg + 90}, 0.5, 0.5)`);

              const stop1 = document.createElementNS(SVG_NS, 'stop');
              stop1.setAttribute('offset', '50%');
              stop1.setAttribute('stop-color', CONFIG.circleColors.fill);

              const stop2 = document.createElementNS(SVG_NS, 'stop');
              stop2.setAttribute('offset', '50%');
              stop2.setAttribute('stop-color', CONFIG.circleColors.halfGradientSecondary || 'transparent');

              grad.appendChild(stop1);
              grad.appendChild(stop2);
              defs.appendChild(grad);
            }

            circle.setAttribute('fill', `url(#${gradId})`);
            const activeGradId = `${gradId}_playback`;
            if (!document.getElementById(activeGradId)) {
              const activeGrad = document.createElementNS(SVG_NS, 'linearGradient');
              activeGrad.setAttribute('id', activeGradId);
              activeGrad.setAttribute('x1', '100%');
              activeGrad.setAttribute('y1', '0%');
              activeGrad.setAttribute('x2', '0%');
              activeGrad.setAttribute('y2', '0%');
              activeGrad.setAttribute('gradientTransform', `rotate(${angleDeg + 90}, 0.5, 0.5)`);

              const activeStop = document.createElementNS(SVG_NS, 'stop');
              activeStop.setAttribute('offset', '50%');
              activeStop.setAttribute('stop-color', CONFIG.interface.colors.playbackDotFill);

              const transparentStop = document.createElementNS(SVG_NS, 'stop');
              transparentStop.setAttribute('offset', '50%');
              transparentStop.setAttribute('stop-color', CONFIG.circleColors.halfGradientSecondary || 'transparent');

              activeGrad.appendChild(activeStop);
              activeGrad.appendChild(transparentStop);
              defs.appendChild(activeGrad);
            }
            circle.setAttribute('data-playback-highlight-fill', `url(#${activeGradId})`);
            circle.setAttribute('stroke', CONFIG.circleColors.fill);
            circle.setAttribute('stroke-width', '1.5');
          } else {
            circle.setAttribute('fill', 'none');
            circle.setAttribute('stroke', CONFIG.circleColors.outlineStroke);
            circle.setAttribute('stroke-width', '2');
          }
          circle.setAttribute('data-default-fill', circle.getAttribute('fill'));
          g.appendChild(circle);
        }
      };

      renderRowAtAngle(leftRowData, leftAngle, leftRowIndex);
      renderRowAtAngle(rightRowData, rightAngle, rightRowIndex);

      return g;
    }

    function renderLabelForSegment(rInner, rOuter, midAngleDeg, labelText, ratio, radialPosition = 0.5, textColor, currentRingRotation = 0) {
      const g = document.createElementNS(SVG_NS, 'g');
      
      const rPos = rInner + (rOuter - rInner) * radialPosition;
      const rad = (midAngleDeg - 90) * (Math.PI / 180);
      const cx = center.x + rPos * Math.cos(rad);
      const cy = center.y + rPos * Math.sin(rad);

      const ringWidth = rOuter - rInner;
      
      const sizeW = ringWidth;
      const sizeH = ringWidth;

      const foreignObject = document.createElementNS(SVG_NS, 'foreignObject');
      foreignObject.setAttribute('width', sizeW);
      foreignObject.setAttribute('height', sizeH);
      foreignObject.setAttribute('x', cx - sizeW / 2);
      foreignObject.setAttribute('y', cy - sizeH / 2);
      foreignObject.setAttribute('data-mid-angle', midAngleDeg);
      foreignObject.setAttribute('data-cx', cx);
      foreignObject.setAttribute('data-cy', cy);
      foreignObject.style.pointerEvents = 'none';
      foreignObject.style.overflow = 'visible';

      let textRot = 0;
      if (CONFIG.uprightLabels) {
        textRot = -currentRingRotation;
      } else {
        textRot = midAngleDeg; // Bottom of alphabets faces the center of the ring
      }

      foreignObject.setAttribute('transform', `rotate(${textRot}, ${cx}, ${cy})`);

      const containerDiv = document.createElement('div');
      containerDiv.className = 'html-label-container';

      const contentSpan = document.createElement('span');
      contentSpan.className = 'html-label-content';
      
      const fontSizeRatio = ratio || 0.35;
      const fontSize = Math.max(ringWidth * fontSizeRatio, 10);
      contentSpan.style.fontSize = `${fontSize}px`;
      
      const color = textColor || CONFIG.labelColors.default;
      contentSpan.style.color = color;
      
      contentSpan.innerHTML = labelText || '';

      containerDiv.appendChild(contentSpan);
      foreignObject.appendChild(containerDiv);
      g.appendChild(foreignObject);

      return g;

    function drawArrow(rInner, rOuter, midAngleDeg, direction) {
      const ringWidth = rOuter - rInner;
      if (ringWidth <= 8) return document.createElementNS(SVG_NS, 'g');

      const len = ringWidth * 0.35; 
      const head = len * 0.45;
      const shaft = len * 0.2;

      const yTip = direction === 'inward' ? -(rInner + ringWidth * 0.1) : -(rOuter - ringWidth * 0.3);
      const yBase = direction === 'inward' ? -(rOuter - ringWidth * 0.1) : -(rInner + ringWidth * 0.4);

      const path = document.createElementNS(SVG_NS, 'path');
      let d = "";

      if (direction === 'inward') {
        d = `M 0,${yTip} L ${head},${yTip - head} L ${shaft},${yTip - head} L ${shaft},${yBase} L -${shaft},${yBase} L -${shaft},${yTip - head} L -${head},${yTip - head} Z`;
      } else {
        d = `M 0,${yTip} L ${head},${yTip + head} L ${shaft},${yTip + head} L ${shaft},${yBase} L -${shaft},${yBase} L -${shaft},${yTip + head} L -${head},${yTip + head} Z`;
      }

      path.setAttribute('d', d);
      path.setAttribute('class', 'arrow');

      const g = document.createElementNS(SVG_NS, 'g');
      g.setAttribute('transform', `translate(${center.x}, ${center.y}) rotate(${midAngleDeg})`);
      g.appendChild(path);

      return g;
    }

    function renderRings() {
      const existingRotations = {};

      svg.innerHTML = '';
      ringStates = {};

      ringsConfig.forEach((cfg) => {
        const ringGroup = document.createElementNS(SVG_NS, 'g');

        const currentRot = existingRotations[cfg.id] || 0;
        ringGroup.setAttribute('transform', `rotate(${currentRot}, ${center.x}, ${center.y})`);

        ringStates[cfg.id] = {
          element: ringGroup,
          rotation: currentRot,
          velocity: 0,
          animId: null,
          rOuter: cfg.rOuter,
          rInner: cfg.rInner
        };

        const segmentLayer = document.createElementNS(SVG_NS, 'g');

        ringGroup.appendChild(segmentLayer);

        // Move playbackSector here so it renders BEFORE the dots/overlay layer
        if (cfg.id === 'outerRing') {
          const playbackSector = document.createElementNS(SVG_NS, 'path');
          playbackSector.setAttribute('class', 'playback-sector');
          playbackSector.setAttribute('fill', CONFIG.interface.colors.playbackSectorFill);
          playbackSector.setAttribute('stroke', CONFIG.interface.colors.playbackSectorStroke);
          playbackSector.setAttribute('stroke-width', CONFIG.interface.sizes.playbackSectorStrokeWidth);
          // Add dotted/dashed stroke styling here
          playbackSector.setAttribute('stroke-dasharray', '1, 8'); // Adjust numbers to change dot spacing/size
          playbackSector.setAttribute('stroke-linecap', 'square');   // Makes the dashes rounded like dots
          playbackSector.style.pointerEvents = 'none';
          playbackSector.style.display = 'none';
          ringGroup.appendChild(playbackSector);
        }

        ringGroup.appendChild(overlayLayer);

        for (let i = 0; i < SEGMENTS; i++) {
          const startAngle = i * DEG_PER_SEGMENT;
          const endAngle = startAngle + DEG_PER_SEGMENT;
          const midAngle = (startAngle + endAngle) / 2;

          let segFillColor = cfg.color;
          if (Array.isArray(cfg.segmentColors) && cfg.segmentColors[i]) {
            segFillColor = cfg.segmentColors[i];
          }

          const path = document.createElementNS(SVG_NS, 'path');
          path.setAttribute('d', createSegmentPath(cfg.rInner, cfg.rOuter, startAngle, endAngle));
          path.setAttribute('class', 'segment');
          path.setAttribute('fill', segFillColor);
          path.setAttribute('stroke', CONFIG.lineColor);
          segmentLayer.appendChild(path);

          if (cfg.type === 'dots') {
            const dotsGroup = renderSegmentDots(cfg.rInner, cfg.rOuter, startAngle, endAngle, i);
            overlayLayer.appendChild(dotsGroup);
          }

          if (cfg.type === 'middleLabels') {
            const labelText = CONFIG.middleRingLabels[i % CONFIG.middleRingLabels.length];
            const ratio = CONFIG.fontSizes ? CONFIG.fontSizes.middleRatio : 0.35;
            const textColor = CONFIG.labelColors.middle || CONFIG.labelColors.default;
            const labelGroup = renderLabelForSegment(cfg.rInner, cfg.rOuter, midAngle, labelText, ratio, 0.7, textColor, currentRot);
            overlayLayer.appendChild(labelGroup);
          }

          if (cfg.type === 'innerLabels') {
            const labelText = CONFIG.innerRingLabels[i % CONFIG.innerRingLabels.length];
            const ratio = CONFIG.fontSizes ? CONFIG.fontSizes.innerRatio : 0.35;
            const textColor = CONFIG.labelColors.inner || CONFIG.labelColors.default;
            const labelGroup = renderLabelForSegment(cfg.rInner, cfg.rOuter, midAngle, labelText, ratio, 0.85, textColor, currentRot);
            overlayLayer.appendChild(labelGroup);
          }

          if (i === 0 && cfg.arrowType) {
            const arrowElement = drawArrow(cfg.rInner, cfg.rOuter, midAngle, cfg.arrowType);
            overlayLayer.appendChild(arrowElement);
          }
        }

        ringGroup.addEventListener('mousedown', (e) => onRingPointerDown(e, cfg.id));
        ringGroup.addEventListener('touchstart', (e) => onRingPointerDown(e, cfg.id), { passive: false });

        svg.appendChild(ringGroup);
      });

      updatePlaybackHighlight();
    }

    function getMouseAngle(e) {
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      const rect = svg.getBoundingClientRect();
      const dx = clientX - (rect.left + center.x);
      const dy = clientY - (rect.top + center.y);
      return Math.atan2(dy, dx) * (180 / Math.PI);
    }

    function applyRotation(ringState, angle) {
      ringState.rotation = angle;
      ringState.element.setAttribute('transform', `rotate(${angle}, ${center.x}, ${center.y})`);

      const labels = ringState.element.querySelectorAll('foreignObject');
      labels.forEach(fo => {
        const cx = fo.getAttribute('data-cx');
        const cy = fo.getAttribute('data-cy');
        if (CONFIG.uprightLabels) {
          fo.setAttribute('transform', `rotate(${-angle}, ${cx}, ${cy})`);
        } else {
          const midAngle = parseFloat(fo.getAttribute('data-mid-angle'));
          fo.setAttribute('transform', `rotate(${midAngle}, ${cx}, ${cy})`);
        }
      });
    }

    function mod(n, m) {
      return ((n % m) + m) % m;
    }

    function ringIndexForPitch(pitch) {
      return mod(pitch - CONFIG.music.ringPitchOrigin, 12);
    }

    function ringIndexForRotation(rotation) {
      return mod(Math.round(rotation / DEG_PER_SEGMENT), SEGMENTS);
    }

    function pitchForArrowRotation(rotation, middleRotation) {
      return mod(CONFIG.music.ringPitchOrigin + ringIndexForRotation(rotation) - ringIndexForRotation(middleRotation), 12);
    }

    function rotationForPitch(pitch) {
      const middleRotation = ringStates.middleRing ? ringStates.middleRing.rotation : 0;
      return (ringIndexForPitch(pitch) + ringIndexForRotation(middleRotation)) * DEG_PER_SEGMENT;
    }

    function setRingRotation(ringId, angle) {
      const ringState = ringStates[ringId];
      if (!ringState) return;
      if (ringState.animId) cancelAnimationFrame(ringState.animId);
      ringState.animId = null;
      ringState.velocity = 0;
      applyRotation(ringState, angle);
    }

    function animateRingToRotation(ringId, angle) {
      const ringState = ringStates[ringId];
      if (!ringState) return;
      if (ringState.animId) cancelAnimationFrame(ringState.animId);

      const startRotation = ringState.rotation;
      const targetRotation = angle + 360 * Math.round((startRotation - angle) / 360);
      const delta = targetRotation - startRotation;
      const duration = CONFIG.motion.selectionDurationMs;
      let startTime = null;
      ringState.velocity = 0;
      const easingFunctions = {
        linear: (progress) => progress,
        easeOutCubic: (progress) => 1 - Math.pow(1 - progress, 3),
        easeInOutCubic: (progress) => progress < 0.5
          ? 4 * progress * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 3) / 2
      };
      const ease = easingFunctions[CONFIG.motion.selectionEasing] || easingFunctions.easeInOutCubic;

      function animate(timestamp) {
        if (startTime === null) startTime = timestamp;
        const progress = Math.min((timestamp - startTime) / duration, 1);
        const eased = ease(progress);
        applyRotation(ringState, startRotation + delta * eased);

        if (progress >= 1) {
          ringState.animId = null;
        } else {
          ringState.animId = requestAnimationFrame(animate);
        }
      }

      ringState.animId = requestAnimationFrame(animate);
    }

    function updateKeyOptions() {
      const nativeOptions = document.getElementById('native-key-options');
      const targetOptions = document.getElementById('target-key-options');

      nativeOptions.innerHTML = KEY_NAMES.map((name, key) =>
        `<button class="key-option" type="button" data-native-key="${key}" aria-pressed="${key === nativeKey}">${name}</button>`
      ).join('');
      targetOptions.innerHTML = KEY_NAMES.map((name, key) =>
        `<button class="key-option" type="button" data-target-key="${key}" aria-pressed="${key === targetKey}">${name}</button>`
      ).join('');

      nativeOptions.querySelectorAll('[data-native-key]').forEach((button) => {
        button.addEventListener('click', () => {
          stopScalePlayback();
          nativeKey = Number(button.dataset.nativeKey);
          updateKeyOptions();
          animateRingToRotation('outerRing', rotationForPitch(nativeKey));
        });
      });

      targetOptions.querySelectorAll('[data-target-key]').forEach((button) => {
        button.addEventListener('click', () => {
          stopScalePlayback();
          targetKey = Number(button.dataset.targetKey);
          updateKeyOptions();
          animateRingToRotation('innerRing', rotationForPitch(targetKey));
        });
      });
      renderScaleSequence();
      renderPlaybackState(null, null, false);
    }

    function updateKeyRingRotations() {
      const outerRotation = rotationForPitch(nativeKey);
      const innerRotation = rotationForPitch(targetKey);
      setRingRotation('outerRing', outerRotation);
      setRingRotation('innerRing', innerRotation);
    }

    function midiToFrequency(midi) {
      return CONFIG.playback.referenceFrequencyHz * Math.pow(2, (midi - CONFIG.playback.referenceMidiNote) / 12);
    }

    function makeScaleSequence() {
      const degreeCount = CONFIG.music.scaleDegrees.length;
      return Array.from({ length: degreeCount * CONFIG.playback.octaveCount }, (_, index) => {
        const degree = CONFIG.music.scaleDegrees[index % degreeCount];
        const octave = Math.floor(index / degreeCount);
        const octaveUp = octave > 0;
        const semitone = MAJOR_OFFSETS[degree - 1] + octave * 12;
        const pitch = mod(targetKey + MAJOR_OFFSETS[degree - 1], 12);
        const sector = mod(pitch - nativeKey, 12);
        const dotRowIndex = sector * 2 + (octaveUp ? 1 : 0);
        return {
          degree,
          octave,
          octaveUp,
          pitch,
          midi: CONFIG.playback.baseMidiNote + targetKey + semitone,
          fingering: CONFIG.outerDotColumns[dotRowIndex],
          sector,
          dotRowIndex
        };
      });
    }

    function renderScaleSequence() {
      const grid = document.getElementById('scale-sequence-grid');
      if (!grid) return;
      const sequence = makeScaleSequence();
      const labels = CONFIG.interface.labels;
      const degreeCount = CONFIG.music.scaleDegrees.length;
      const getOctaveLabel = (octave) => labels.scaleSequenceOctaveLabels[octave]
        || formatConfiguredLabel(labels.scaleSequenceOctaveTemplate, { octave: octave + 1 });
      grid.style.setProperty('--sequence-degree-count', degreeCount);
      grid.replaceChildren();

      for (let octave = 0; octave < CONFIG.playback.octaveCount; octave++) {
        const octaveRow = document.createElement('section');
        octaveRow.className = 'scale-sequence-octave';
        octaveRow.setAttribute('role', 'group');
        octaveRow.setAttribute('aria-label', getOctaveLabel(octave));

        const octaveHeading = document.createElement('div');
        octaveHeading.className = 'scale-sequence-octave-heading';
        octaveHeading.textContent = getOctaveLabel(octave);

        const octaveSteps = document.createElement('div');
        octaveSteps.className = 'scale-sequence-octave-steps';
        octaveSteps.setAttribute('role', 'list');

        sequence.filter((note) => note.octave === octave).forEach((note) => {
          const index = octave * degreeCount + CONFIG.music.scaleDegrees.indexOf(note.degree);
          const step = document.createElement('div');
          step.className = 'scale-sequence-step';
          step.setAttribute('role', 'listitem');
          step.setAttribute('data-sequence-index', index);
          step.setAttribute('aria-label', formatConfiguredLabel(labels.scaleStepAria, {
            degree: note.degree,
            octaveSuffix: note.octaveUp ? labels.sequenceUpperOctaveSuffix : '',
            note: KEY_NAMES[note.pitch]
          }));

          const noteLabel = document.createElement('div');
          noteLabel.className = 'scale-sequence-note';
          noteLabel.textContent = KEY_NAMES[note.pitch];

          const degreeLabel = document.createElement('div');
          degreeLabel.className = 'scale-sequence-degree';
          degreeLabel.textContent = formatConfiguredLabel(labels.scaleDegreeTemplate, {
            degree: note.degree,
            octaveSuffix: note.octaveUp ? labels.sequenceUpperOctaveSuffix : ''
          });

          const holes = document.createElement('div');
          holes.className = 'scale-sequence-holes';
          holes.setAttribute('aria-hidden', 'true');
          note.fingering.forEach((value) => {
            const hole = document.createElement('span');
            hole.className = `scale-sequence-hole${value === 1 ? ' closed' : value === 0.5 ? ' half' : ''}`;
            holes.appendChild(hole);
          });

          step.append(noteLabel, degreeLabel, holes);
          octaveSteps.appendChild(step);
        });

        octaveRow.append(octaveHeading, octaveSteps);
        grid.appendChild(octaveRow);
      }
      updateScaleSequenceHighlight();
    }

    function updateScaleSequenceHighlight() {
      document.querySelectorAll('.scale-sequence-step').forEach((step, index) => {
        step.classList.toggle('active', index === activePlaybackIndex);
      });
    }

    function renderPlaybackFingering(note, isPlaceholder = false) {
      const fingers = document.getElementById('playback-fingers');
      const degreeLabel = formatConfiguredLabel(CONFIG.interface.labels.scaleDegreeTemplate, {
        degree: note.degree,
        octaveSuffix: note.octaveUp ? CONFIG.interface.labels.sequenceUpperOctaveSuffix : ''
      });
      const holeMarkup = note.fingering.map((value) =>
        `<span class="playback-hole${value === 1 ? ' closed' : value === 0.5 ? ' half' : ''}" aria-label="${value === 1 ? CONFIG.interface.labels.closedHole : value === 0.5 ? CONFIG.interface.labels.halfHole : CONFIG.interface.labels.openHole}"></span>`
      ).join('');

      fingers.classList.toggle('placeholder', isPlaceholder);
      fingers.setAttribute('aria-hidden', String(isPlaceholder));
      fingers.innerHTML = `<div class="playback-fingering-caption"><span class="playback-fingering-note">${KEY_NAMES[note.pitch]}</span><span class="playback-fingering-degree">${degreeLabel}</span></div><div class="playback-fingering-holes">${holeMarkup}</div>`;
    }

    function renderPlaybackState(note, noteIndex, isPlaying) {
      const status = document.getElementById('scale-player-status');
      const detail = document.getElementById('scale-player-detail');
      const playButton = document.getElementById('play-scale-button');
      const fingers = document.getElementById('playback-fingers');
      const progress = document.getElementById('scale-progress');

      playButton.innerHTML = isPlaying
        ? '<svg class="play-scale-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="5" width="14" height="14" fill="currentColor"></rect></svg>'
        : '<svg class="play-scale-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon></svg>';
      playButton.setAttribute('aria-label', isPlaying ? CONFIG.interface.labels.stopScale : CONFIG.interface.labels.playScale);
      playButton.setAttribute('aria-pressed', String(isPlaying));
      if (note) {
        const octave = Math.floor(note.midi / 12) - CONFIG.playback.displayOctaveOffset;
        status.textContent = formatConfiguredLabel(CONFIG.interface.labels.scaleDegreeStatus, {
          degree: note.degree,
          octaveSuffix: note.octaveUp ? CONFIG.interface.labels.upperOctaveSuffix : '',
          note: KEY_NAMES[note.pitch],
          octave
        });
        detail.textContent = formatConfiguredLabel(CONFIG.interface.labels.scaleDetail, {
          target: KEY_NAMES[targetKey],
          native: KEY_NAMES[nativeKey]
        });
        renderPlaybackFingering(note);
      } else {
        status.textContent = formatConfiguredLabel(CONFIG.interface.labels.scaleStatus, {
          target: KEY_NAMES[targetKey]
        });
        detail.textContent = formatConfiguredLabel(CONFIG.interface.labels.scaleDetail, {
          target: KEY_NAMES[targetKey],
          native: KEY_NAMES[nativeKey]
        });
        const placeholderNote = makeScaleSequence()[0];
        if (placeholderNote) {
          renderPlaybackFingering(placeholderNote, true);
        } else {
          fingers.innerHTML = '';
          fingers.classList.add('placeholder');
          fingers.setAttribute('aria-hidden', 'true');
        }
      }
      progress.querySelectorAll('.scale-progress-dot').forEach((dot, index) => {
        dot.classList.toggle('active', index === noteIndex);
      });
      activePlaybackSector = note ? note.sector : null;
      activePlaybackDotRow = note ? note.dotRowIndex : null;
      activePlaybackIndex = note ? noteIndex : null;
      updatePlaybackHighlight();
      updateScaleSequenceHighlight();
    }

    function formatConfiguredLabel(template, values) {
      return template.replace(/\{(\w+)\}/g, (placeholder, name) => values[name] ?? placeholder);
    }

    function updatePlaybackHighlight() {
      const outerRing = ringStates.outerRing?.element;
      if (!outerRing) return;
      outerRing.querySelectorAll('.playback-dot-active, .playback-dot-inactive').forEach((circle) => {
        circle.classList.remove('playback-dot-active');
        circle.classList.remove('playback-dot-inactive');
        circle.setAttribute('fill', circle.getAttribute('data-default-fill'));
      });
      const highlight = outerRing.querySelector('.playback-sector');
      if (!highlight) return;
      if (activePlaybackSector === null) {
        highlight.style.display = 'none';
        return;
      }
      const activeRow = outerRing.querySelectorAll(`[data-dot-row-index="${activePlaybackDotRow}"]`);
      activeRow.forEach((circle) => {
        circle.classList.add('playback-dot-active');
        if (circle.getAttribute('data-dot-value') === '0.5') {
          circle.setAttribute('fill', circle.getAttribute('data-playback-highlight-fill'));
        }
      });
      const inactiveRowIndex = activePlaybackDotRow % 2 === 0
        ? activePlaybackDotRow + 1
        : activePlaybackDotRow - 1;
      outerRing.querySelectorAll(`[data-dot-row-index="${inactiveRowIndex}"]`).forEach((circle) => {
        circle.classList.add('playback-dot-inactive');
      });
      const outerConfig = ringsConfig.find((cfg) => cfg.id === 'outerRing');
      const startAngle = activePlaybackSector * DEG_PER_SEGMENT;
      highlight.setAttribute('d', createSegmentPath(
        outerConfig.rInner,
        outerConfig.rOuter,
        startAngle,
        startAngle + DEG_PER_SEGMENT
      ));
      highlight.style.display = '';
    }

    async function playScale() {
      if (isScalePlaying) {
        stopScalePlayback();
        return;
      }

      const runId = ++playbackRunId;
      isScalePlaying = true;
      renderPlaybackState(null, null, true);
      const sequence = makeScaleSequence();
      let audioContext;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error(CONFIG.interface.labels.unsupportedAudio);
        audioContext = window.scaleAudioContext || (window.scaleAudioContext = new AudioContextClass());
        await audioContext.resume();
        for (let index = 0; index < sequence.length; index++) {
          if (runId !== playbackRunId) return;
          const note = sequence[index];
          const noteDuration = CONFIG.playback.noteDurationMs / 1000 / playbackSpeed;
          const noteDurationMs = CONFIG.playback.noteDurationMs / playbackSpeed;
          renderPlaybackState(note, index, true);
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          currentOscillator = oscillator;
          oscillator.type = CONFIG.playback.oscillatorType;
          oscillator.frequency.value = midiToFrequency(note.midi);
          const now = audioContext.currentTime;
          gain.gain.setValueAtTime(CONFIG.playback.releaseGain, now);
          gain.gain.linearRampToValueAtTime(CONFIG.playback.attackGain, now + CONFIG.playback.attackDurationMs / 1000 / playbackSpeed);
          gain.gain.linearRampToValueAtTime(CONFIG.playback.sustainGain, now + noteDuration * CONFIG.playback.sustainRatio);
          gain.gain.linearRampToValueAtTime(CONFIG.playback.releaseGain, now + noteDuration);
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + noteDuration + CONFIG.playback.oscillatorTailMs / 1000 / playbackSpeed);
          await new Promise((resolve) => setTimeout(resolve, noteDurationMs + CONFIG.playback.interNoteGapMs / playbackSpeed));
          if (currentOscillator === oscillator) currentOscillator = null;
        }
        if (runId === playbackRunId) {
          isScalePlaying = false;
          renderPlaybackState(null, null, false);
        }
      } catch (error) {
        if (runId === playbackRunId) {
          isScalePlaying = false;
          renderPlaybackState(null, null, false);
          document.getElementById('scale-player-status').textContent = error.message;
        }
      }
    }

    function stopScalePlayback() {
      if (!isScalePlaying) return;
      playbackRunId++;
      isScalePlaying = false;
      if (currentOscillator) {
        try { currentOscillator.stop(); } catch (error) { /* Oscillator may have ended. */ }
        currentOscillator = null;
      }
      renderPlaybackState(null, null, false);
    }

    function initializeScalePlayer() {
      const progress = document.getElementById('scale-progress');
      const progressCount = CONFIG.music.scaleDegrees.length * CONFIG.playback.octaveCount;
      progress.innerHTML = Array.from({ length: progressCount }, () => '<span class="scale-progress-dot"></span>').join('');
      renderPlaybackSpeedOptions();
      document.getElementById('play-scale-button').addEventListener('click', playScale);
      renderPlaybackState(null, null, false);
    }

    function renderPlaybackSpeedOptions() {
      const options = document.getElementById('playback-speed-options');
      options.innerHTML = CONFIG.playback.speedOptions.map((speed) => {
        const label = formatConfiguredLabel(CONFIG.interface.labels.speedOptionTemplate, { speed });
        return `<button class="speed-option" type="button" data-playback-speed="${speed}" aria-pressed="${speed === playbackSpeed}">${label}</button>`;
      }).join('');
      options.querySelectorAll('[data-playback-speed]').forEach((button) => {
        button.addEventListener('click', () => {
          playbackSpeed = Number(button.dataset.playbackSpeed);
          renderPlaybackSpeedOptions();
        });
      });
    }

    function snapToSegment(ringState) {
      const targetRotation = Math.round(ringState.rotation / DEG_PER_SEGMENT) * DEG_PER_SEGMENT;
      const startRot = ringState.rotation;
      const delta = targetRotation - startRot;
      let progress = 0;

      function snapStep() {
        progress += CONFIG.motion.snapProgressIncrement;
        if (progress >= 1) {
          applyRotation(ringState, targetRotation);
          ringState.animId = null;
          syncSelectionFromRing(ringState);
        } else {
          const current = startRot + delta * (1 - (1 - progress) * (1 - progress));
          applyRotation(ringState, current);
          ringState.animId = requestAnimationFrame(snapStep);
        }
      }

      ringState.animId = requestAnimationFrame(snapStep);
    }

    function syncSelectionFromRing(ringState) {
      stopScalePlayback();
      if (ringState.element.id === 'outerRing') {
        nativeKey = pitchForArrowRotation(ringState.rotation, ringStates.middleRing.rotation);
      } else if (ringState.element.id === 'innerRing') {
        targetKey = pitchForArrowRotation(ringState.rotation, ringStates.middleRing.rotation);
      } else if (ringState.element.id === 'middleRing') {
        nativeKey = pitchForArrowRotation(ringStates.outerRing.rotation, ringState.rotation);
        targetKey = pitchForArrowRotation(ringStates.innerRing.rotation, ringState.rotation);
      }
      updateKeyOptions();
      if (resumeScaleAfterRingTurn) {
        resumeScaleAfterRingTurn = false;
        playScale();
      }
    }

    function startInertia(ringState) {
      function inertiaStep() {
        ringState.velocity *= CONFIG.motion.inertiaFriction;

        if (Math.abs(ringState.velocity) < CONFIG.motion.inertiaStopVelocity) {
          ringState.velocity = 0;
          snapToSegment(ringState);
        } else {
          applyRotation(ringState, ringState.rotation + ringState.velocity);
          ringState.animId = requestAnimationFrame(inertiaStep);
        }
      }

      ringState.animId = requestAnimationFrame(inertiaStep);
    }

    function onRingPointerDown(e, ringId) {
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      const rect = svg.getBoundingClientRect();
      const dx = clientX - (rect.left + center.x);
      const dy = clientY - (rect.top + center.y);
      const clickDist = Math.sqrt(dx * dx + dy * dy);

      let targetRingId = ringId;
      for (const cfg of ringsConfig) {
        if (clickDist >= cfg.rInner && clickDist <= cfg.rOuter) {
          targetRingId = cfg.id;
          break;
        }
      }

      activeRing = ringStates[targetRingId];
      if (!activeRing) return;
      resumeScaleAfterRingTurn = isScalePlaying;
      stopScalePlayback();

      if (e.cancelable) e.preventDefault();
      e.stopPropagation();

      if (activeRing.animId) {
        cancelAnimationFrame(activeRing.animId);
      }

      startAngle = getMouseAngle(e);
      initialRotation = activeRing.rotation;
      lastAngle = startAngle;
      lastTime = performance.now();
      activeRing.velocity = 0;

      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);
      window.addEventListener('touchmove', onPointerMove, { passive: false });
      window.addEventListener('touchend', onPointerUp);
    }

    function onPointerMove(e) {
      if (!activeRing) return;
      if (e.cancelable) e.preventDefault();
      
      const currentAngle = getMouseAngle(e);
      const now = performance.now();
      const dt = Math.max(now - lastTime, CONFIG.motion.minimumPointerDeltaMs);

      let angleDelta = currentAngle - lastAngle;
      if (angleDelta > 180) angleDelta -= 360;
      if (angleDelta < -180) angleDelta += 360;

      activeRing.velocity = angleDelta * (CONFIG.motion.velocityFrameDurationMs / dt);

      const totalDelta = currentAngle - startAngle;
      applyRotation(activeRing, initialRotation + totalDelta);

      lastAngle = currentAngle;
      lastTime = now;
    }

    function onPointerUp() {
      if (!activeRing) return;

      window.removeEventListener('mousemove', onPointerMove);
      window.removeEventListener('mouseup', onPointerUp);
      window.removeEventListener('touchmove', onPointerMove);
      window.removeEventListener('touchend', onPointerUp);

      if (Math.abs(activeRing.velocity) > CONFIG.motion.dragInertiaThreshold) {
        startInertia(activeRing);
      } else {
        snapToSegment(activeRing);
      }

      activeRing = null;
    }

    window.addEventListener('resize', updateDimensions);
    applyInterfaceConfig();
    renderMarkdownFooter();
    updateDimensions();
    updateKeyOptions();
    updateKeyRingRotations();
    initializeScalePlayer();
  </script>
</body>
</html>
